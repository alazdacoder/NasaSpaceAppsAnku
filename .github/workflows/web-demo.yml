# Web demo on GitHub Pages: the same app, with the Python backend running in the
# visitor's browser (Pyodide). Every push to main republishes it.
name: Web demo

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the demo
        working-directory: frontend
        env:
          VITE_DEMO: "1"
          SHMS_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python3 scripts/demo-bundle.py dist
          cp dist/index.html dist/404.html   # deep links (/crew, /team/...) open the app
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
