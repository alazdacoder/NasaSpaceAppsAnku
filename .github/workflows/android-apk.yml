# Builds SpaceHealthManagementSystem.apk: the whole app (Python simulator + web UI) runs on the phone.
#  - Run it by hand: GitHub -> Actions -> "Android APK" -> Run workflow
#    (download the APK from the run's "Artifacts" section).
#  - Push a tag like v1.1.0 to also attach the APK to a GitHub Release.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chaquopy needs the same Python version on the build machine as in the app.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the app with the phone's Python packages
        run: |
          python -m venv /tmp/phone-py
          /tmp/phone-py/bin/pip install -q -r android/app/requirements.txt pytest==8.3.4 httpx==0.27.2
          cd backend && /tmp/phone-py/bin/python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Copy the app into the Android project
        run: ./android/prepare.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Keep the same debug signing key between runs, so a new APK installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/SpaceHealthManagementSystem.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceHealthManagementSystem-android
          path: out/SpaceHealthManagementSystem.apk
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "SHMS $GITHUB_REF_NAME" \
              --notes "Windows executable and Android APK. Simulated-data decision-support demo; not a medical device." || true
          gh release upload "$GITHUB_REF_NAME" out/SpaceHealthManagementSystem.apk --clobber
