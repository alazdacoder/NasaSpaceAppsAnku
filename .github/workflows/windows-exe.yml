# Builds dist/CrewHealthHub.exe on Windows, smoke-tests it and uploads it.
#  - Run it by hand: GitHub -> Actions -> "Windows executable" -> Run workflow
#    (download the .exe from the run's "Artifacts" section).
#  - Push a tag like v1.0.0 to also attach the .exe to a GitHub Release.
name: Windows executable

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.22.3

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

      - name: Build UI
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build executable
        run: pyinstaller --noconfirm packaging/CrewHealthHub.spec

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $env:HUB_DATA_DIR = "$env:RUNNER_TEMP\hubdata"
          $p = Start-Process -FilePath "dist\CrewHealthHub.exe" -ArgumentList "--no-browser","--port","8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8123/api/crew/c1/today" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if ($ok) {
            $ui = Invoke-WebRequest "http://127.0.0.1:8123/" -UseBasicParsing
            if ($ui.Content -notmatch "Crew Health Hub") { $ok = $false }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "CrewHealthHub.exe did not start or serve the UI" }
          Write-Host "Smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: CrewHealthHub-windows
          path: dist/CrewHealthHub.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Crew Health Hub $GITHUB_REF_NAME" \
              --notes "Windows executable. Simulated-data decision-support demo; not a medical device."
          gh release upload "$GITHUB_REF_NAME" dist/CrewHealthHub.exe --clobber
