# ---------------------------------------------------------------------------
# Cross-source rules. All conditions must hold. Fields: value (latest raw), ewma,
# z, slope (per day over slope_days), pct (% vs baseline), pct_abs (size of pct).
# ---------------------------------------------------------------------------
cross_rules:
  - id: stone_risk
    title: Kidney-stone risk is high
    title_tr: Böbrek taşı riski yüksek
    level: red
    when:
      - {metric: caox_ss, field: ewma, op: ">", value: 2.0}
      - {metric: u_volume, field: ewma, op: "<", value: 2.0}
    recs: [hydrate, start_k_citrate]
    reason: "Stone risk {caox_ss.ewma} is above 2.0 and urine volume {u_volume.ewma} L/day is under 2 L/day."
    reason_tr: "Taş riski {caox_ss.ewma} ile 2.0'ın üzerinde ve idrar hacmi {u_volume.ewma} L/gün ile 2 L/gün'ün altında."
    source: "https://ntrs.nasa.gov/citations/20090019087 ; https://ntrs.nasa.gov/citations/20000084164"
    verified: true
  - id: bone_loss
    title: Bone-loss warning
    title_tr: Kemik kaybı uyarısı
    level: red
    phases: [inflight]
    when:
      - {metric: ared_week_min, field: value, op: "<", value: 200}
      - {metric: u_calcium, field: slope, op: ">", value: 1.0}
    recs: [resume_resistance, contact_surgeon]
    reason: "Resistance exercise is low ({ared_week_min.value} min this week) while urine calcium is rising ({u_calcium.slope} mg/day each day)."
    reason_tr: "Direnç egzersizi az (bu hafta {ared_week_min.value} dk) ve idrar kalsiyumu artıyor (her gün {u_calcium.slope} mg/gün)."
    source: *sim
    verified: false
  - id: exercise_dehydration
    title: Not drinking enough for your exercise
    title_tr: Egzersizine göre yeterince su içmiyorsun
    level: amber
    when:
      - {metric: ex_total_min, field: value, op: ">", value: 60}
      - {metric: water_l, field: ewma, op: "<", value: 2.6}
      - {metric: u_sg, field: ewma, op: ">", value: 1.020}
    recs: [hydrate]
    reason: "You exercised {ex_total_min.value} min but drink {water_l.ewma} L/day and urine is concentrated (SG {u_sg.ewma})."
    reason_tr: "{ex_total_min.value} dk egzersiz yaptın ama günde {water_l.ewma} L içiyorsun ve idrarın yoğun (ÖA {u_sg.ewma})."
    source: *sim
    verified: false
  - id: fatigue
    title: Fatigue risk
    title_tr: Yorgunluk riski
    level: amber
    when:
      - {metric: sleep_h, field: ewma, op: "<", value: 6.0}
      - {metric: hr_rest, field: z, op: ">", value: 1.5}
    recs: [reduce_intensity, sleep_protect]
    reason: "Sleep averages {sleep_h.ewma} h and resting heart rate is {hr_rest.z} SD above your baseline."
    reason_tr: "Uyku ortalaman {sleep_h.ewma} sa ve dinlenik nabzın kişisel referansının {hr_rest.z} SS üzerinde."
    source: *sim
    verified: false
  - id: energy_deficit
    title: Burning more than you eat
    title_tr: Yediğinden fazlasını harcıyorsun
    level: amber
    when:
      - {metric: energy_balance, field: ewma, op: "<", value: -450}
      - {metric: mass_kg, field: slope, op: "<", value: -0.03}
    recs: [eat_more]
    reason: "Energy balance averages {energy_balance.ewma} kcal/day and body mass is falling ({mass_kg.slope} kg/day)."
    reason_tr: "Enerji dengen günde ortalama {energy_balance.ewma} kcal ve vücut kütlen azalıyor (günde {mass_kg.slope} kg)."
    source: *sim
    verified: false
  - id: cognitive_fatigue
    title: Slower reactions after poor sleep
    title_tr: Kötü uykudan sonra tepkiler yavaşladı
    level: amber
    when:
      - {metric: sleep_h, field: ewma, op: "<", value: 6.0}
      - {metric: pvt_rt_ms, field: z, op: ">", value: 1.5}
    recs: [postpone_critical, sleep_protect]
    reason: "Sleep averages {sleep_h.ewma} h and reaction time is {pvt_rt_ms.z} SD slower than your baseline."
    reason_tr: "Uyku ortalaman {sleep_h.ewma} sa ve tepki süren kişisel referansından {pvt_rt_ms.z} SS daha yavaş."
    source: *sim
    verified: false
  - id: isolation_strain
    title: Isolation strain
    title_tr: Yalnızlık yükü
    level: amber
    when:
      - {metric: connection, field: ewma, op: "<", value: 3.0}
      - {metric: feeling, field: ewma, op: "<", value: 3.2}
    recs: [family_contact, talk_psych]
    reason: "Feeling connected averages {connection.ewma}/5 and mood {feeling.ewma}/5."
    reason_tr: "Bağlı hissetme ortalaman {connection.ewma}/5 ve ruh halin {feeling.ewma}/5."
    source: *sim
    verified: false
  - id: workload_stress
    title: Workload is driving stress up
    title_tr: İş yükü stresi artırıyor
    level: amber
    when:
      - {metric: workload_h, field: ewma, op: ">", value: 10.0}
      - {metric: stress, field: ewma, op: ">", value: 3.2}
    recs: [reduce_workload, take_break]
    reason: "Work averages {workload_h.ewma} h/day and stress {stress.ewma}/5."
    reason_tr: "Çalışma günde ortalama {workload_h.ewma} sa ve stres {stress.ewma}/5."
    source: *sim
    verified: false
  - id: vestibular_dysfunction
    title: Post-flight vestibular dysfunction
    title_tr: Uçuş sonrası vestibüler bozukluk
    level: red
    phases: [postflight]
    when:
      - {metric: vest_sot, field: pct, op: "<", value: -15}
      - {metric: vest_dizzy, field: value, op: ">", value: 3}
    recs: [fall_precautions, no_driving, vestibular_rehab]
    reason: "Balance score is {vest_sot.pct_abs}% below your preflight baseline and dizziness is {vest_dizzy.value}/10."
    reason_tr: "Denge puanın uçuş öncesi referansının %{vest_sot.pct_abs} altında ve baş dönmen {vest_dizzy.value}/10."
    source: *sim
    verified: false
  - id: orthostatic_intolerance
    title: Feeling faint when standing
    title_tr: Ayakta dururken bayılma hissi
    level: amber
    phases: [postflight]
    when:
      - {metric: ortho_hr_rise, field: value, op: ">", value: 30}
      - {metric: vest_dizzy, field: value, op: ">", value: 2}
    recs: [stand_slowly, hydrate]
    reason: "Heart rate jumps {ortho_hr_rise.value} bpm when you stand and dizziness is {vest_dizzy.value}/10."
    reason_tr: "Ayağa kalkınca nabzın {ortho_hr_rise.value} atım/dk artıyor ve baş dönmen {vest_dizzy.value}/10."
    source: *sim
    verified: false

# Protocol response rule: flags a protocol that is not working.
protocol_rules:
  min_days: 14
  poor_response_below: 0.35
  level: amber
  recs: [contact_surgeon]
  source: *sim
  verified: false

# ---------------------------------------------------------------------------
# Fixed recommendation list.
# ---------------------------------------------------------------------------
recommendations:
  hydrate:
    text: Drink more water today. Aim for urine above 2.5 L/day.
    text_tr: Bugün daha fazla su iç. İdrarını günde 2.5 L'nin üzerinde tutmayı hedefle.
    source: https://ntrs.nasa.gov/citations/20000084164
    verified: true
  start_k_citrate:
    text: "Start potassium citrate: 20 mEq/day, two 10 mEq pills with your last meal."
    text_tr: "Potasyum sitrata başla: günde 20 mEq, son öğünle birlikte iki adet 10 mEq tablet."
    source: https://ntrs.nasa.gov/citations/20090019087
    verified: true
  resume_resistance:
    text: Do today's ARED session. Resistance exercise slows bone loss.
    text_tr: Bugünkü ARED seansını yap. Direnç egzersizi kemik kaybını yavaşlatır.
    source: *sim
    verified: false
  resume_exercise:
    text: Get back to your exercise plan. Target is about 600 min/week.
    text_tr: Egzersiz planına geri dön. Hedef haftada yaklaşık 600 dakika.
    source: npj Microgravity (2020, 2023)
    verified: true
  reduce_intensity:
    text: Swap today's hard session for a moderate one and rest more.
    text_tr: Bugünkü zorlu seansı orta tempolu bir seansla değiştir ve daha çok dinlen.
    source: *sim
    verified: false
  sleep_protect:
    text: Protect tonight's sleep window. Dim lights and screens an hour before.
    text_tr: Bu geceki uyku saatini koru. Yatmadan bir saat önce ışıkları ve ekranları kıs.
    source: *sim
    verified: false
  core_temp_check:
    text: Rest, drink water and recheck core temperature in 1 hour. Tell the surgeon if it stays above 38.0 °C.
    text_tr: Dinlen, su iç ve 1 saat sonra vücut sıcaklığını yeniden ölç. 38.0 °C'nin üzerinde kalırsa hekime bildir.
    source: *clinical
    verified: false
  check_co2:
    text: Move to a well-ventilated module and report the CO2 reading.
    text_tr: İyi havalandırılan bir modüle geç ve CO2 değerini bildir.
    source: *sim
    verified: false
  radiation_shelter:
    text: Follow the radiation shelter procedure until the alert ends.
    text_tr: Uyarı bitene kadar radyasyon sığınağı prosedürünü uygula.
    source: *sim
    verified: false
  eat_more:
    text: Add a snack. You are eating less than the usual flight range or less than you burn.
    text_tr: Bir ara öğün ekle. Olağan uçuş aralığından ya da harcadığından daha az yiyorsun.
    source: npj Microgravity (2020, 2023)
    verified: true
  lower_salt:
    text: Choose lower-salt foods today. Salt raises urine calcium.
    text_tr: Bugün daha az tuzlu yiyecekler seç. Tuz idrar kalsiyumunu artırır.
    source: *clinical
    verified: false
  contact_surgeon:
    text: Flag this for the flight surgeon at the next link window.
    text_tr: Bunu bir sonraki bağlantı penceresinde uçuş hekimine bildir.
    source: *sim
    verified: false
  talk_psych:
    text: Book a private conference with the crew psychologist at the next link window.
    text_tr: Bir sonraki bağlantı penceresinde mürettebat psikoloğuyla özel görüşme planla.
    source: *sim
    verified: false
  family_contact:
    text: Plan a call with family or friends. On a Mars-delay mission, record a video message instead.
    text_tr: Ailen ya da arkadaşlarınla bir görüşme planla. Mars gecikmeli görevde bunun yerine video mesaj kaydet.
    source: *sim
    verified: false
  take_break:
    text: Take 15-20 minutes for yourself today - music, the window view, or a chat with the crew.
    text_tr: Bugün kendine 15-20 dakika ayır - müzik, pencereden manzara ya da ekiple sohbet.
    source: *sim
    verified: false
  postpone_critical:
    text: Postpone safety-critical tasks (spacewalk, robotic arm) until your reaction time recovers.
    text_tr: Tepki süren düzelene kadar güvenlik açısından kritik görevleri (uzay yürüyüşü, robot kol) ertele.
    source: *sim
    verified: false
  reduce_workload:
    text: Ask mission control to move non-critical tasks off today's schedule.
    text_tr: Görev kontrolünden kritik olmayan işleri bugünkü programdan çıkarmasını iste.
    source: *sim
    verified: false
  fall_precautions:
    text: High fall risk. Walk only with a helper or a handrail, and sit down to dress and shower.
    text_tr: Düşme riski yüksek. Yalnızca biriyle ya da tutunarak yürü; giyinirken ve duş alırken otur.
    source: *sim
    verified: false
  no_driving:
    text: Do not drive, cycle or climb ladders until the flight surgeon clears you.
    text_tr: Uçuş hekimi onay verene kadar araba kullanma, bisiklete binme ve merdivene tırmanma.
    source: *sim
    verified: false
  vestibular_rehab:
    text: "Do today's vestibular rehab: head turns while looking at a target, plus balance drills (20 min)."
    text_tr: "Bugünkü vestibüler rehabilitasyonu yap: bir hedefe bakarken baş çevirme ve denge alıştırmaları (20 dk)."
    source: *sim
    verified: false
  head_slow:
    text: Move your head slowly. Avoid quick turns and bending down.
    text_tr: Başını yavaş hareket ettir. Ani dönüşlerden ve öne eğilmekten kaçın.
    source: *sim
    verified: false
  stand_slowly:
    text: Stand up in stages - sit for a minute first, drink water, tense your leg muscles.
    text_tr: Aşama aşama ayağa kalk - önce bir dakika otur, su iç, bacak kaslarını sık.
    source: *sim
    verified: false
  prelanding_training:
    text: Do your pre-landing balance training. It shortens balance recovery after landing.
    text_tr: İniş öncesi denge antrenmanını yap. İnişten sonra dengenin toparlanmasını kısaltır.
    source: *sim
    verified: false

# ---------------------------------------------------------------------------
# Supplement protocols and their response targets.
#   progress = 1 - |current - target| / |start - target|, clipped to 0..1,
#   on EWMA-smoothed values. `stop_at_target: true` treats values past the
#   target in the wanted direction as reached (progress 1).
# ---------------------------------------------------------------------------
protocols:
  potassium_citrate:
    label: Potassium citrate
    label_tr: Potasyum sitrat
    dose_text: 10 mEq x 2 with the last meal (20 mEq/day)
    dose_text_tr: Son öğünle 10 mEq x 2 (günde 20 mEq)
    dose_meq_per_day: 20
    pills_per_day: 2
    source: https://ntrs.nasa.gov/citations/20090019087
    verified: true
    effects:   # used by the simulator; scaled by adherence and personal response factor
      citrate_mg: 135
      ph: 0.25
      potassium_meq: 16
    targets:
      - {metric: u_citrate, mode: delta, value: 135, direction: up, label: "Citrate +130-140 mg/day", label_tr: "Sitrat +130-140 mg/gün", source: "https://ntrs.nasa.gov/citations/20090019087", verified: true}
      - {metric: u_ph, mode: delta, value: 0.25, direction: up, label: "pH +0.2-0.3", label_tr: "pH +0.2-0.3", source: "https://ntrs.nasa.gov/citations/20090019087", verified: true}
    stop_at_target: true
    days_to_target_fraction: 0.9   # "reached" = 90% progress on the exponential fit (assumed)

# ---------------------------------------------------------------------------
# Food catalogue for manual entries (nutrient values are illustrative).
# ---------------------------------------------------------------------------
food_catalog:
  source: *sim
  verified: false
  items:
    - {id: breakfast, label: Breakfast tray, label_tr: Kahvaltı tepsisi, kcal: 550, protein_g: 25, sodium_mg: 900, calcium_mg: 250, vitd_iu: 40, water_l: 0.2}
    - {id: lunch, label: Lunch tray, label_tr: Öğle yemeği tepsisi, kcal: 750, protein_g: 35, sodium_mg: 1400, calcium_mg: 250, vitd_iu: 40, water_l: 0.3}
    - {id: dinner, label: Dinner tray, label_tr: Akşam yemeği tepsisi, kcal: 800, protein_g: 40, sodium_mg: 1500, calcium_mg: 300, vitd_iu: 40, water_l: 0.3}
    - {id: snack, label: Snack bar, label_tr: Atıştırmalık bar, kcal: 250, protein_g: 10, sodium_mg: 150, calcium_mg: 100, vitd_iu: 0, water_l: 0.0}
    - {id: vitd, label: Vitamin D tablet, label_tr: D vitamini tableti, kcal: 0, protein_g: 0, sodium_mg: 0, calcium_mg: 0, vitd_iu: 800, water_l: 0.0}

nutrition_targets:
  kcal: {value: 2296, range: [1847, 2745], source: "npj Microgravity (2020, 2023): mean ± 1 SD", verified: true}
  protein_g: {value: 90, source: *clinical, verified: false}
  sodium_mg: {value: 3500, max: true, source: *clinical, verified: false}
  calcium_mg: {value: 1000, source: *clinical, verified: false}
  vitd_iu: {value: 800, source: *clinical, verified: false}

# ---------------------------------------------------------------------------
# Ground link. Delays run in REAL time (not on the fast mission clock) so the
# lag is visible in the demo.
# ---------------------------------------------------------------------------
link:
  snapshot_every_s: 5
  profiles:
    iss:
      label: ISS (near real time)
      label_tr: ISS (neredeyse gerçek zamanlı)
      delay_s: 0.5
      blackout: {period_s: 90, duration_s: 8}
      source: *brief
      verified: false
    gateway:
      label: Gateway (~1.3 s)
      label_tr: Gateway (~1.3 sn)
      delay_s: 1.3
      blackout: {period_s: 180, duration_s: 15}
      source: *brief
      verified: false
    mars:
      label: Mars (up to 22 min)
      label_tr: Mars (22 dakikaya kadar)
      delay_s: 1320
      delay_min_s: 20
      delay_max_s: 1320
      blackout: {period_s: 300, duration_s: 40}
      source: *brief
      verified: false
  default_profile: iss
