  items:
    - {id: breakfast, label: Breakfast tray, label_tr: Kahvaltı tepsisi, kcal: 550, protein_g: 25, sodium_mg: 900, calcium_mg: 250, vitd_iu: 40, water_l: 0.2}
    - {id: lunch, label: Lunch tray, label_tr: Öğle yemeği tepsisi, kcal: 750, protein_g: 35, sodium_mg: 1400, calcium_mg: 250, vitd_iu: 40, water_l: 0.3}
    - {id: dinner, label: Dinner tray, label_tr: Akşam yemeği tepsisi, kcal: 800, protein_g: 40, sodium_mg: 1500, calcium_mg: 300, vitd_iu: 40, water_l: 0.3}
    - {id: snack, label: Snack bar, label_tr: Atıştırmalık bar, kcal: 250, protein_g: 10, sodium_mg: 150, calcium_mg: 100, vitd_iu: 0, water_l: 0.0}
