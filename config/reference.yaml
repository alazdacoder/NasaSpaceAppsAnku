  # Annual medical examination rules (MR089S, JSC 28913). Each item is checked
  # against the crew member's age and sex for the year of their next birth month.
  annual_exam:
    source: "MR089S Annual Medical Examinations, Medical Requirements Integration Documents JSC 28913 (https://nlsp.nasa.gov/doc/MR089S.pdf)"
    verified: true
    note: Collected in each astronaut's birth month. The psychological evaluation is due within 3 months of the birth month.
    note_tr: Her astronotun doğum ayında yapılır. Psikolojik değerlendirme doğum ayını izleyen 3 ay içinde yapılmalıdır.
    items:
      - {id: physical, rule: yearly, label: "Physical exam (vital signs lying, sitting and standing, temperature, breathing rate, height, weight)", label_tr: "Fizik muayene (yatarak, oturarak ve ayakta yaşamsal bulgular, ateş, solunum hızı, boy, kilo)"}
      - {id: labs, rule: yearly, label: "Clinical labs: blood (CBC, chemistry, lipids, ionized calcium, iron panel, TSH, free T4, hs-CRP) and urinalysis; 12-hour fast", label_tr: "Klinik laboratuvar: kan (tam kan sayımı, kimya, lipitler, iyonize kalsiyum, demir paneli, TSH, serbest T4, hs-CRP) ve idrar tahlili; 12 saat açlık"}
      - {id: psa, rule: yearly, sex: M, min_age: 40, label: "PSA (prostate), men 40 and older", label_tr: "PSA (prostat), 40 yaş ve üzeri erkekler"}
      - {id: audiometry, rule: yearly, label: "Audiometry (pure-tone hearing thresholds)", label_tr: "Odyometri (saf ses işitme eşikleri)"}
      - {id: ecg, rule: yearly, label: "Resting 12-lead ECG", label_tr: "İstirahat 12 derivasyonlu EKG"}
      - {id: optometry, rule: yearly, label: "Optometry exam (visual acuity, refraction, tonometry, dilated fundus exam)", label_tr: "Göz muayenesi (görme keskinliği, kırma kusuru, tonometri, dilate fundus muayenesi)"}
      - {id: dental, rule: yearly, label: "Dental exam", label_tr: "Diş muayenesi"}
      - {id: psych, rule: yearly, label: "Psychological evaluation (POMS questionnaire and interview)", label_tr: "Psikolojik değerlendirme (POMS anketi ve görüşme)"}
      - {id: pap, rule: yearly, sex: F, label: "Pap smear", label_tr: "Pap smear"}
      - {id: gxt, rule: gxt_age, label: "Graded exercise test (max HR, VO2max): ages 30, 35, 40; every 2 years at 40-50; every year after 50", label_tr: "Kademeli egzersiz testi (en yüksek nabız, VO2max): 30, 35, 40 yaşlarında; 40-50 arası 2 yılda bir; 50'den sonra her yıl"}
      - {id: dxa, rule: every_3_years, label: "Bone density (DXA) with bone markers, every 3 years", label_tr: "Kemik yoğunluğu (DXA) ve kemik belirteçleri, 3 yılda bir"}
      - {id: eye3, rule: every_3_years, label: "Threshold visual fields and retinal photography, every 3 years", label_tr: "Eşik görme alanı ve retina fotoğrafı, 3 yılda bir"}
      - {id: mammo, rule: mammo_age, sex: F, label: "Mammography: every 2 years at 40-50, every year after 50", label_tr: "Mamografi: 40-50 arası 2 yılda bir, 50'den sonra her yıl"}
      - {id: procto, rule: at_ages, ages: [40, 45, 55, 65, 70], label: "Proctosigmoidoscopy at ages 40, 45, 55, 65 and 70", label_tr: "Proktosigmoidoskopi: 40, 45, 55, 65 ve 70 yaşlarında"}
      - {id: colon, rule: at_ages, ages: [50, 60], label: "Colonoscopy at ages 50 and 60", label_tr: "Kolonoskopi: 50 ve 60 yaşlarında"}

  # When this app runs four LSAH-category tests during the mission (days relative
  # to launch; r_days relative to landing). The categories are LSAH's; the exact
  # days are this demo's choice.
  mission_tests:
    source: *sim
    verified: false
    tests:
      - id: blood_draw
        category_id: 4
        label: LSAH blood draw (vitamin D, hemoglobin)
        label_tr: LSAH kan alımı (D vitamini, hemoglobin)
        detail: 15 min. A crewmate draws the blood; the sample is spun in the centrifuge and frozen.
        detail_tr: 15 dk. Kanı bir ekip arkadaşı alır; örnek santrifüjde ayrılır ve dondurulur.
        metrics: [vitd_serum, hemoglobin]
        days: [-9, 30, 60, 90, 120, 150, 175]
        r_days: [0, 14]
      - id: gxt
        category_id: 28
        label: Graded exercise test on CEVIS (VO2peak)
        label_tr: CEVIS'te kademeli egzersiz testi (VO2peak)
        detail: 30 min. Pedal while the load rises every minute until you cannot keep the pace.
        detail_tr: 30 dk. Yük her dakika artarken tempoyu sürdüremeyene kadar pedal çevir.
        metrics: [vo2peak]
        days: [-7, 15, 45, 75, 105, 135, 165]
        r_days: [5, 15]
      - id: dxa
        category_id: 36
        label: Bone density scan (DXA)
        label_tr: Kemik yoğunluğu taraması (DXA)
        detail: 60 min at the clinic. Lie still on the scanner table.
        detail_tr: Klinikte 60 dk. Tarayıcı masasında hareketsiz uzan.
        metrics: [bmd_hip]
        days: [-8]
        r_days: [7]

  # How the four LSAH tests change in the simulation (assumptions).
  model:
    source: *sim
    verified: false
    bmd_loss_pct_per_month: 0.4         # hip bone density lost in flight with full resistance exercise
    bmd_loss_extra_pct_per_month: 3.0   # extra loss in proportion to missed ARED (bone deficit)
    vo2_inflight_drop: 0.08             # early in-flight drop, fading over ~40 days with exercise
    vo2_postflight_drop: 0.10           # drop on landing day, fading over ~7 days
    vitd_inflight_floor_ng_ml: 15       # steady state with no vitamin D intake and no sunlight
    vitd_ng_ml_per_100_iu: 2.0          # steady-state rise per 100 IU/day eaten
    vitd_tau_days: 45
    vitd_tablet_iu: 800
    hb_inflight_drop: 0.06              # "space anemia": share of hemoglobin lost early in flight

# ---------------------------------------------------------------------------
# Ground link. Delays run in REAL time (not on the fast mission clock) so the
# lag is visible in the demo.
# ---------------------------------------------------------------------------
link:
  snapshot_every_s: 5
  profiles:
    iss:
      label: ISS (near real time)
      label_tr: ISS (neredeyse gerçek zamanlı)
      delay_s: 0.5
      blackout: {period_s: 90, duration_s: 8}
      source: *brief
      verified: false
    gateway:
      label: Gateway (~1.3 s)
      label_tr: Gateway (~1.3 sn)
      delay_s: 1.3
      blackout: {period_s: 180, duration_s: 15}
      source: *brief
      verified: false
    mars:
      label: Mars (up to 22 min)
      label_tr: Mars (22 dakikaya kadar)
      delay_s: 1320
      delay_min_s: 20
      delay_max_s: 1320
      blackout: {period_s: 300, duration_s: 40}
      source: *brief
      verified: false
  default_profile: iss
