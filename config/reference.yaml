      variables: "Vitals, Med history, Physical exam, Blood chemistry, Urinalysis, Pulmonary"
      variables_tr: "Yaşamsal bulgular, tıbbi öykü, fizik muayene, kan kimyası, idrar tahlili, akciğer"
