  sodium_mg: {value: 3500, max: true, source: *clinical, verified: false}
  calcium_mg: {value: 1000, source: *clinical, verified: false}
  vitd_iu: {value: 800, source: *clinical, verified: false}

# ---------------------------------------------------------------------------
# LSAH - Lifetime Surveillance of Astronaut Health (NASA Life Sciences Portal,
# https://nlsp.nasa.gov/resources/lsah). LSAH holds real astronauts' medical
# records; they are protected by the Privacy Act and HIPAA and released only as
# grouped data or through an approved data request, so this app uses NO real
# astronaut values. What it takes from LSAH is the structure: which tests exist,
# in which mission phase they are done, and the annual-exam schedule.
# ---------------------------------------------------------------------------
lsah:
  source: "NASA Life Sciences Portal - LSAH: Medical Data Available for Request (https://nlsp.nasa.gov/doc/Medical%20Data%20Available%20for%20Request.xlsx)"
  verified: true
  catalog:   # every LSAH data category, as listed in NASA's file (flags: pre / in-flight / post-flight / annual)
    - id: 1
      title: "Non-Public Domain Photo/ Video of medical / behavioral mission activities"
      title_tr: "Tıbbi / davranışsal görev etkinliklerinin kamuya açık olmayan fotoğraf ve videoları"
      variables: "Imagery of blood draws or other medical procedures, exercise sessions, etc."
      variables_tr: "Kan alımı, diğer tıbbi işlemler, egzersiz seansları vb. görüntüleri"
      phases: {pre: true, in: true, post: true, annual: ""}
      mrid: "N/A"
      app_metrics: []
    - id: 2
      title: "Clinical Assessment"
      title_tr: "Klinik değerlendirme"
      variables: "Diagnoses; Vitals, Head and face, ENT, Eyes, Neck, Pulmonary, Abdomen & Pelvic, Rectum, Genitourinary, Breasts, Extremities, Spine, Skin, Neurologic findings"
      variables_tr: "Tanılar; yaşamsal bulgular, baş-yüz, KBB, göz, boyun, akciğer, karın ve pelvis, rektum, ürogenital, meme, ekstremiteler, omurga, deri, nörolojik bulgular"
      phases: {pre: true, in: false, post: true, annual: "yes"}
      mrid: "1.1, MR009S/L, MSD-MO-044, MSD-MO-045"
      app_metrics: ["hr_rest", "bp_sys", "bp_dia", "resp_rate", "core_temp", "spo2"]
    - id: 3
      title: "Inflight (CMO) Health Status & Pre/Post EVA Evaluations"
